[project]
name = "youtube-to-obsidian-pkm"
version = "0.1.0"
description = "Extrai conhecimento estruturado de vídeos e conferências do YouTube diretamente para um cofre Obsidian."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.0.0",
    "youtube-transcript-api>=0.6.0",
    "yt-dlp>=2024.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.35.0",
]

audio = [
    "faster-whisper>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"